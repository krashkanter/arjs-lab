<!--Angular JS program to print the students details and find the price of books purchased-->

<!doctype html>
<html ng-app="">
    <head>
        <title>ARJS Program 4</title>
        <script src="angular.min.js"></script>
    </head>
    <body>
        <div
            ng-init="
            quantity    = 10;
            cost        = 30;
            student     = { firstname: 'Mahesh', lastname: 'Parashar', rollno: 100 };
            marks       = [ 80, 90, 75, 73, 60 ];
            "
        >
            <p>Hello {{ student.firstname + " " + student.lastname }}!</p>
            <p>Roll No: {{ student.rollno }}</p>
            <p>Expense of Books: Rs. {{ cost * quantity }}</p>
            <p>Marks:</p>
            <ul>
                <li ng-repeat="x in marks">{{x}}</li>
            </ul>
        </div>
    </body>
</html>
