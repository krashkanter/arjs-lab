<!--Angular JS program to add two numbers by taking input from text box and create add function to add two numbers-->

<!doctype html>
<html ng-app="App">
    <head>
        <title>ARJS Program 5</title>
        <script src="angular.min.js"></script>
    </head>
    <body ng-controller="Controller">
        <input type="number" ng-model="num1" placeholder="Number 1" />
        <input type="number" ng-model="num2" placeholder="Number 2" />
        <button ng-click="add()">Add</button>

        <p>Result:{{ result }}</p>
    </body>
</html>
<script>
    var app = angular.module("App", []);
    app.controller("Controller", function ($scope) {
        $scope.add = function () {
            $scope.result = $scope.num1 + $scope.num2;
        };
    });
</script>
