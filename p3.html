<!--AngularJS program to use of repeat command to print the name in the multi array-->

<!doctype html>
<html ng-app="">
    <head>
        <title>ARJS Program 3</title>
        <script src="angular.min.js"></script>
    </head>
    <body>
        <div ng-init="names=['Chris', 'Max', 'Neo']">
            <ul>
                <li ng-repeat="x in names">{{x}}</li>
            </ul>
        </div>
    </body>
</html>
