<!--AngularJS program to read the values from textbox and display it using expression-->

<!doctype html>
<html ng-app="">
    <head>
        <title>ARJS Program 2</title>
        <script src="angular.min.js"></script>
    </head>
    <body>
        <p>Enter your name: <input type="text" ng-model="name" /></p>
        <p>Hello {{name}}!</p>
    </body>
</html>
