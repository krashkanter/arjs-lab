<!--AngularJS program to read the values from textbox and display it-->

<!doctype html>
<html ng-app="">
    <head>
        <title>ARJS Program 1</title>
        <script src="angular.min.js"></script>
    </head>
    <body>
        <p>Enter your name: <input type="text" ng-model="name" /></p>
        <p>Hello <span ng-bind="name"></span>!</p>
    </body>
</html>
